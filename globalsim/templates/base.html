<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GlobalSIM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('principal') }}">GlobalSIM</a>
        <div class="navbar-nav">
            <a class="nav-link" href="{{ url_for('listaPaises') }}">Países</a>
            <a class="nav-link" href="{{ url_for('cadastrarPais') }}">Cadastrar país</a>
            <a class="nav-link" href="{{ url_for('cobertura') }}">Cobertura</a>
        </div>
    </div>
</nav>
<div class="container">
    {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% for categoria, texto in mensagens %}
            <div class="alert alert-{{ categoria }}">{{ texto }}</div>
        {% endfor %}
    {% endwith %}
    {% block conteudo %}{% endblock %}
</div>
</body>
</html>
